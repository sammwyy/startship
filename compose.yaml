services:
  startship:
    build: .
    container_name: startshipd
    restart: unless-stopped
    environment:
      STARTSHIP_SELF_CONTAINER: startshipd
      STARTSHIP_DATA: /data
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - startship-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - startship
networks:
  startship:
    name: startship
volumes:
  startship-data:
