services:
  startship:
    build: .
    container_name: startshipd
    restart: unless-stopped
    environment:
      STARTSHIP_SELF_CONTAINER: startshipd
      STARTSHIP_DATA: /data
      # HTTPS (optional): uncomment both, point the domain's DNS at this server
      # and open ports 80/443. The dashboard is then served at https://<domain>.
      # STARTSHIP_ACME_EMAIL: you@example.com
      # STARTSHIP_DASHBOARD_DOMAIN: startship.example.com
      # First run prints admin credentials: docker compose logs startship
      # Sign in and change the temporary password to complete setup.
      # Or seed credentials without a forced change (only on an empty database):
      # STARTSHIP_ADMIN_USER: admin
      # STARTSHIP_ADMIN_PASSWORD: change-this-password
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - startship-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - startship
networks:
  startship:
    name: startship
volumes:
  startship-data:
