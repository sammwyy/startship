<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Startship · Deployment platform</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E↗%3C/text%3E%3C/svg%3E"
    />
    <script>
      const themeData = document.documentElement.dataset;
      try {
        const key = location.pathname.startsWith("/status/")
          ? "startship-status-theme"
          : "startship-theme";
        const saved = localStorage.getItem(key);
        const style = localStorage.getItem(key + "-style");
        const accent = localStorage.getItem(key + "-accent");
        themeData.themeStyle = style === "carbon" ? "carbon" : "tinted";
        themeData.accent = [
          "green",
          "blue",
          "violet",
          "pink",
          "orange",
          "cyan",
        ].includes(accent)
          ? accent
          : "green";
        themeData.themePreference =
          saved === "light" || saved === "dark" ? saved : "system";
        themeData.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch {
        themeData.theme = "dark";
        themeData.themeStyle = "tinted";
        themeData.accent = "green";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
